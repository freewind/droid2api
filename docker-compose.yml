version: '3.8'

services:
  droid2api:
    build: .
    container_name: droid2api
    ports:
      - "3000:3000"
    environment:
      # 认证：静态 Factory API key（必填，永不过期）
      - FACTORY_API_KEY=${FACTORY_API_KEY}
      # 可选：上游 x-factory-org-id 使用的 Factory 侧组织 ID
      - FACTORY_ORG_ID=${FACTORY_ORG_ID}
      # 如需修改端口，在config.json中配置
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
